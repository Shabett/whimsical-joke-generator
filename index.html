<!DOCTYPE html>
<html>
<head>
  <title>Whimsical Joke Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    body { 
      font-family: 'Fredoka', cursive; 
      text-align: center; 
      color: #333;
      padding-top: 50px; 
      box-sizing: border-box;
      background-repeat: no-repeat;
      background-attachment: fixed;
      transition: background 0.4s ease, background-color 0.4s ease;
    }
    .btn-whimsical { 
      background-color: #6A5ACD; 
      color: white; 
      border: none; 
      padding: 10px 20px; 
      font-size: 16px; 
      cursor: pointer; 
      border-radius: 5px; 
      margin: 5px;
    }
    .btn-plain {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin: 5px;
    }
    @keyframes floatAndFade {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-100px) scale(1.5);
      }
    }
    .emoji-pop {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: floatAndFade 1s ease-out forwards;
    }

    /* Menu & Drawer Styles */
    .menu-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: inherit;
    }
    .drawer {
      position: fixed;
      top: 0;
      left: -300px;
      width: 250px;
      height: 100%;
      background-color: #ffffff;
      color: #333;
      box-shadow: 2px 0 15px rgba(0,0,0,0.2);
      transition: left 0.3s ease;
      z-index: 1000;
      padding: 20px;
      text-align: left;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .drawer.open {
      left: 0;
    }
    .drawer-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      float: right;
    }

    /* Settings & View Options */
    .setting-group {
      margin-top: 20px;
    }
    .view-btn {
      margin: 5px 2px;
      padding: 8px 12px;
      font-family: 'Fredoka', cursive;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #6A5ACD;
      border-radius: 6px;
      background: white;
      color: #333;
    }
    .view-btn:hover {
      background: #6A5ACD;
      color: white;
    }

    /* Phone View Layout */
    #appContainer {
      transition: all 0.3s ease;
      margin: 0 auto;
      padding-bottom: 40px;
    }
    #appContainer.phone-view {
      max-width: 340px;
      border: 8px solid #333;
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    /* Theme Options */
    .theme-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .theme-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      font-family: 'Fredoka', cursive;
      font-size: 14px;
      background: #f0f0f0;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }
    .theme-opt.active {
      border-color: #6A5ACD;
      background: #e8e5ff;
      font-weight: bold;
    }
    .color-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    /* Background Themes */
    body.theme-blossom { background: #CBC3E3; }
    body.theme-stardust { background: linear-gradient(135deg, #ffb7b2 0%, #ffeccc 50%, #e7c6ff 100%); }
    body.theme-matcha { background: linear-gradient(135deg, #2d6a4f 0%, #a3b18a 50%, #d8f3dc 100%); }
    body.theme-rainbow { background: linear-gradient(90deg, #ffadad, #ffd6a5, #fdffb6, #caffbf, #9bf6ff, #a0c4ff, #bdb2ff); }

    /* Heart & Liked Jokes Styles */
    .heart-container { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .heart-btn { font-size: 42px; background: none; border: none; cursor: pointer; transition: transform 0.2s ease; outline: none; }
    .heart-btn:hover { transform: scale(1.15); }
    @keyframes heartThump {
      0% { transform: scale(1); }
      30% { transform: scale(1.45); }
      60% { transform: scale(0.85); }
      100% { transform: scale(1); }
    }
    .heart-pop { animation: heartThump 0.4s ease-out; }
    
    .accordion-btn { 
      width: 100%; 
      background: #f0f0f0; 
      border: 1px solid #ccc; 
      padding: 10px; 
      text-align: left; 
      font-family: 'Fredoka', cursive; 
      font-size: 14px; 
      cursor: pointer; 
      border-radius: 6px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .liked-dropdown { display: none; margin-top: 8px; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
    .liked-dropdown.open { display: flex; }
    .liked-card { background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
    .liked-card-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .card-btn { background: white; border: 1px solid #bbb; border-radius: 4px; cursor: pointer; padding: 2px 6px; font-size: 12px; }
    .card-btn:hover { background: #eee; }

    /* Version Badge in Drawer */
    .drawer-version {
      margin-top: 30px;
      padding: 6px;
      font-size: 14px;
      font-weight: bold;
      color: #6A5ACD;
      text-align: center;
      background: #e8e5ff;
      border-radius: 6px;
    }
  </style>
</head>
<body class="theme-blossom">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div id="drawer" class="drawer">
    <button class="drawer-close" onclick="toggleMenu()">✕</button>
    <h3>Settings ⚙️</h3>

    <div class="setting-group">
      <label><strong>Screen View:</strong></label><br>
      <button class="view-btn" onclick="setViewMode('desktop')">Desktop View</button>
      <button class="view-btn" onclick="setViewMode('phone')">Phone View</button>
    </div>

    <div class="setting-group">
      <label><strong>Themes:</strong></label>
      <div class="theme-list">
        <button class="theme-opt active" onclick="setTheme('theme-blossom', this)">
          <span class="color-circle" style="background: #CBC3E3;"></span> Blossom
        </button>
        <button class="theme-opt" onclick="setTheme('theme-stardust', this)">
          <span class="color-circle" style="background: linear-gradient(135deg, #ffb7b2, #ffeccc, #e7c6ff);"></span> Stardust
        </button>
        <button class="theme-opt" onclick="setTheme('theme-matcha', this)">
          <span class="color-circle" style="background: linear-gradient(135deg, #2d6a4f, #d8f3dc);"></span> Matcha
        </button>
        <button class="theme-opt" onclick="setTheme('theme-rainbow', this)">
          <span class="color-circle" style="background: linear-gradient(90deg, #ffadad, #ffd6a5, #fdffb6, #caffbf, #9bf6ff);"></span> Rainbow
        </button>
      </div>
    </div>

    <div class="setting-group">
      <button class="accordion-btn" onclick="toggleLikedMenu()">
        <span>Liked Jokes 💖</span>
        <span id="likedCountBadge">(0/5) ▼</span>
      </button>
      <div id="likedDropdown" class="liked-dropdown">
        <div id="likedJokesList">
          <p style="font-size: 12px; color: #777; margin: 4px 0;">No saved jokes yet!</p>
        </div>
      </div>
    </div>

    <div class="drawer-version">Version v2.0</div>
  </div>

  <div id="appContainer">
    <h1>Whimsical Joke Generator✨</h1>
    <button class="btn-whimsical" onclick="getWhimsyJoke()">Tell me a Whimsical Joke!</button>
    <button class="btn-plain" onclick="getLessWhimsyJoke()">Tell me a Less Whimsical Joke</button>
    
    <p id="joke">Your joke will appear here!</p>

    <!-- Heart / Favorite Section -->
    <div class="heart-container">
      <span id="heartLabel" style="font-size: 14px; font-weight: bold;">Like this joke?</span>
      <button id="heartBtn" class="heart-btn" onclick="likeCurrentJoke()">❤️</button>
      <span id="heartStatus" style="font-size: 13px; color: #2e7d32; min-height: 18px; font-weight: bold;"></span>
    </div>
  </div>

  <script>
    let currentThemeClass = "theme-blossom";
    let likedJokes = [];

    function toggleMenu() {
      document.getElementById("drawer").classList.toggle("open");
    }

    function setViewMode(mode) {
      const container = document.getElementById("appContainer");
      if (mode === "phone") {
        container.classList.add("phone-view");
      } else {
        container.classList.remove("phone-view");
      }
    }

    function setTheme(themeClass, btnElement) {
      currentThemeClass = themeClass;
      document.body.style.backgroundColor = "";
      document.body.className = themeClass;

      document.querySelectorAll('.theme-opt').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
    }

    function playPopSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.8, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {
        console.log("Audio play prevented");
      }
    }

    function resetHeartState() {
      document.getElementById("heartLabel").innerText = "Like this joke?";
      document.getElementById("heartStatus").innerText = "";
    }

    async function getWhimsyJoke() {
      document.body.style.backgroundColor = "";
      document.body.className = currentThemeClass;
      document.getElementById("joke").innerText = "Loading a whimsical joke...";
      resetHeartState();

      try {
        const response = await fetch("https://v2.jokeapi.dev/joke/Any?safe-mode");
        const data = await response.json();
        const joketext = data.type === "single"
          ? data.joke
          : `${data.setup} — ${data.delivery}`;
        document.getElementById("joke").innerText = joketext;
      } catch (error) {
        document.getElementById("joke").innerText = "Oops! Couldn't fetch a joke right now.";
      }

      spawnEmoji();
      spawnEmoji();
      spawnEmoji();
    }

    async function getLessWhimsyJoke() {
      document.body.className = "";
      document.body.style.backgroundColor = "#81c784";
      document.getElementById("joke").innerText = "Loading a less whimsical joke...";
      resetHeartState();

      try {
        const response = await fetch("https://v2.jokeapi.dev/joke/Programming,Misc?safe-mode");
        const data = await response.json();
        const joketext = data.type === "single"
          ? data.joke
          : `${data.setup} — ${data.delivery}`;
        document.getElementById("joke").innerText = joketext;
      } catch (error) {
        document.getElementById("joke").innerText = "Oops! Couldn't fetch a joke right now.";
      }
    }

    function likeCurrentJoke() {
      const currentJoke = document.getElementById("joke").innerText.trim();
      const statusEl = document.getElementById("heartStatus");

      if (currentJoke === "Your joke will appear here!" || currentJoke.startsWith("Loading")) {
        statusEl.innerText = "Get a joke first before liking!";
        return;
      }

      if (likedJokes.includes(currentJoke)) {
        statusEl.innerText = "You already liked this joke!";
        return;
      }

      if (likedJokes.length >= 5) {
        statusEl.innerText = "Storage full (5/5)! Delete one in settings to add more.";
        return;
      }

      const heartBtn = document.getElementById("heartBtn");
      heartBtn.classList.remove("heart-pop");
      void heartBtn.offsetWidth;
      heartBtn.classList.add("heart-pop");
      playPopSound();

      likedJokes.push(currentJoke);
      document.getElementById("heartLabel").innerText = "Liked!";
      statusEl.innerText = "Thank you for liking this joke!";

      updateLikedJokesUI();
    }

    function toggleLikedMenu() {
      document.getElementById("likedDropdown").classList.toggle("open");
    }

    function updateLikedJokesUI() {
      const badge = document.getElementById("likedCountBadge");
      const listContainer = document.getElementById("likedJokesList");
      badge.innerText = `(${likedJokes.length}/5) ▼`;

      if (likedJokes.length === 0) {
        listContainer.innerHTML = `<p style="font-size: 12px; color: #777; margin: 4px 0;">No saved jokes yet!</p>`;
        return;
      }

      listContainer.innerHTML = "";
      likedJokes.forEach((jokeText, index) => {
        const card = document.createElement("div");
        card.className = "liked-card";
        card.innerHTML = `
          <span>${jokeText}</span>
          <div class="liked-card-actions">
            <button class="card-btn" onclick="copyJoke(${index})">📋 Copy</button>
            <button class="card-btn" onclick="deleteJoke(${index})">🗑️</button>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function copyJoke(index) {
      const text = likedJokes[index];
      navigator.clipboard.writeText(text);
      alert("Joke copied to clipboard!");
    }

    function deleteJoke(index) {
      likedJokes.splice(index, 1);
      updateLikedJokesUI();
    }

    function spawnEmoji() {
      const emojis = ["✨", "🦄", "🌈", "🎉", "🎈", "🎭", "⭐"];
      const emoji = document.createElement("span");
      emoji.className = "emoji-pop";
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

      const x = window.innerWidth / 2 + (Math.random() * 260 - 130);
      const y = window.innerHeight / 2 + (Math.random() * 100 - 50);

      emoji.style.left = `${x}px`;
      emoji.style.top = `${y}px`;

      document.body.appendChild(emoji);

      setTimeout(() => emoji.remove(), 1000);
    }
  </script>
</body>
</html>
